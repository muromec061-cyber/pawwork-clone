name: 🐾 PawWork Agent Poll

on:
  schedule:
    # Каждые 5 минут запускаем новый long-polling сеанс
    # Внутри скрипт висит ~4.5 мин с Telegram long polling — ответы МГНОВЕННЫЕ
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Telegram Chat ID (опционально)'
        required: false
      message:
        description: 'Сообщение для обработки (опционально)'
        required: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    # GitHub Actions free tier: 2000 мин/мес Linux
    # ~288 запусков/день × ~2 мин = ~576 мин → 8640 сообщений/мес
    timeout-minutes: 8
    
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🚀 Run PawWork Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PAWWORK_API_KEY: ${{ secrets.PAWWORK_API_KEY }}
          STORAGE_REPO: ${{ github.repository }}
        run: python src/agent.py

      - name: 💾 Commit state changes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git config --global user.name "PawWork Clone Bot"
          git config --global user.email "bot@pawwork.ai"
          git add -A
          git diff --cached --quiet || (git commit -m "🔄 Auto-update agent state [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)
